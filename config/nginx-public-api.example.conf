# Include the map in http {}, and adapt this server to the deployed TLS listener.
# nginx -t must pass before an operator reloads the edge configuration.
map $http_origin $tonswap_allow_origin {
    default "";
    "https://test.tonswap.org" "https://test.tonswap.org";
}

server {
    listen 8080;
    server_name ti.soramitsu.io;

    # `always` is required for proxy-generated rate limits and upstream failures.
    add_header Access-Control-Allow-Origin $tonswap_allow_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type, accept" always;
    add_header Access-Control-Expose-Headers "retry-after, x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset" always;
    add_header Access-Control-Max-Age 600 always;

    location ~ ^/api/indexer/v1/(metrics|debug|snapshot)(/|$) {
        return 404;
    }

    location / {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One CORS policy at the edge prevents duplicate ACAO header failures.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
    }
}
