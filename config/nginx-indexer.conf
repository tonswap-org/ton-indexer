# Render this http{} include with the deployment's public mount and local listener.
# Variables: {{PUBLIC_MOUNT}} (no trailing slash, e.g. /api/indexer-r2),
# {{LISTEN}} (host:port), {{BACKEND}} (loopback host:port), {{ERROR_ROOT}} (directory
# containing the byte-exact proxy-error.json). The backend mount is /api/indexer.
# Run nginx -t on the rendered configuration before installing it.
upstream tonswap_indexer_backend {
    server {{BACKEND}};
    keepalive 16;
}

map $http_origin $tonswap_allow_origin {
    default "";
    "https://test.tonswap.org" "https://test.tonswap.org";
}

server {
    listen {{LISTEN}};
    server_name _;

    add_header Access-Control-Allow-Origin $tonswap_allow_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type, accept" always;
    add_header Access-Control-Expose-Headers "retry-after, x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset" always;
    add_header Access-Control-Max-Age 600 always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-TONSwap-Edge-Key $http_x_tonswap_edge_key;
    proxy_set_header X-TONSwap-Client-IP $http_x_tonswap_client_ip;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    # The application keeps its own typed errors, Retry-After and rate-limit headers.
    # Only nginx-generated connection/read errors enter the static fallback.
    error_page 502 503 504 =503 @indexer_unavailable;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;

    location ~ ^{{PUBLIC_MOUNT}}/v1/(metrics|debug|snapshot)(/|$) {
        default_type application/json;
        return 404 '{"error":"Not found.","code":"not_found"}';
    }

    location = {{PUBLIC_MOUNT}}/v1/stream/balances {
        if ($request_method = OPTIONS) { return 204; }
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_pass http://tonswap_indexer_backend/api/indexer/v1/stream/balances;
    }

    location {{PUBLIC_MOUNT}}/ {
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://tonswap_indexer_backend/api/indexer/;
    }

    location @indexer_unavailable {
        internal;
        default_type application/json;
        root "{{ERROR_ROOT}}";
        try_files /proxy-error.json =503;
        add_header Access-Control-Allow-Origin $tonswap_allow_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type, accept" always;
        add_header Access-Control-Expose-Headers "retry-after, x-ratelimit-limit, x-ratelimit-remaining, x-ratelimit-reset" always;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Not found.","code":"not_found"}';
    }
}
