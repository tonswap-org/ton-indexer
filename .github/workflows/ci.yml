name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Branch flow audit
        run: |
          bash ./scripts/test-branch-flow-audit.sh
          bash ./scripts/audit-branch-flow.sh
      - name: Audit public artifacts
        run: ./scripts/audit-public-artifacts.sh
      - name: TODO debt audit
        run: |
          bash ./scripts/test-todo-debt-audit.sh
          bash ./scripts/audit-todo-debt.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Deployment evidence audit
        run: |
          npm run test:deployment-evidence-template
          npm run generate:deployment-evidence-template -- --output build/reports/production-deployment-evidence-template.json
          npm run test:deployment-evidence-audit
          npm run audit:deployment-evidence
      - run: npm test
      - run: npm run build
      - name: Build production Docker image
        run: docker build -t ton-indexer:ci .
      - name: Verify production dependency surface
        run: |
          docker run --rm --entrypoint sh ton-indexer:ci -c '
            for package in tsx typescript @types/node; do
              if npm ls --include=dev --all "$package" >/dev/null 2>&1 &&
                ! npm ls --omit=dev --all "$package" >/dev/null 2>&1; then
                echo "Development-only dependency leaked into runtime image: $package" >&2
                exit 1
              fi
            done
          '
